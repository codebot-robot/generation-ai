---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: models.generationai.labs.gke.io
spec:
  group: generationai.labs.gke.io
  names:
    kind: Model
    listKind: ModelList
    plural: models
    singular: model
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.filesImported
      name: Files
      type: integer
    - jsonPath: .status.bytesImported
      name: Bytes
      type: integer
    - jsonPath: .spec.source.repo
      name: Source
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Model is the Schema for the models API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelSpec defines the desired state of Model
            properties:
              files:
                description: Files is a list of files that make up the model.
                items:
                  properties:
                    path:
                      description: Path is the relative path of the file within the
                        model.
                      type: string
                    sha256:
                      description: SHA256 is the SHA256 hash of the file content.
                      type: string
                    size:
                      description: Size is the file size in bytes, when known.
                      format: int64
                      type: integer
                  required:
                  - path
                  - sha256
                  type: object
                type: array
              source:
                description: |-
                  Source records where the files were imported from, when they
                  were imported rather than uploaded.
                properties:
                  commitSha:
                    description: CommitSHA is the commit the revision resolved to
                      at import time.
                    type: string
                  repo:
                    description: Repo is the Hub repository id, e.g. Qwen/Qwen3-8B-FP8.
                    type: string
                  revision:
                    description: Revision is the revision that was asked for (a branch,
                      tag or commit).
                    type: string
                required:
                - repo
                type: object
            type: object
          status:
            description: ModelStatus defines the observed state of Model
            properties:
              bytesImported:
                description: BytesImported counts the bytes written to the store by
                  this import.
                format: int64
                type: integer
              filesImported:
                type: integer
              filesTotal:
                description: FilesTotal and FilesImported count the files of an import.
                type: integer
              message:
                description: Message explains a Failed phase.
                type: string
              phase:
                description: Phase is Importing, Ready or Failed.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
