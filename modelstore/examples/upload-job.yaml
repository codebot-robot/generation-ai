apiVersion: batch/v1
kind: Job
metadata:
  name: opt-125m
  namespace: modelstore
spec:
  template:
    spec:
      serviceAccountName: default
      volumes:
        - name: model-data
          emptyDir: {}
      initContainers:
        - name: download
          image: python:3.11-slim
          command: ["bash", "-c"]
          args:
            - |
              pip install huggingface_hub
              python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='facebook/opt-125m', local_dir='/data/opt-125m')"
          volumeMounts:
            - name: model-data
              mountPath: /data
      containers:
        - name: upload
          image: modelstore:latest
          command: ["/modelstore"]
          args:
            - "upload"
            - "--modelstore-url=http://modelstore.modelstore"
            - "--model-name=opt-125m"
            - "--model-dir=/data/opt-125m"
          volumeMounts:
            - name: model-data
              mountPath: /data
      restartPolicy: OnFailure
