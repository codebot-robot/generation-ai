apiVersion: batch/v1
kind: Job
metadata:
  name: agentfs-bench-job
spec:
  parallelism: 1
  completions: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: benchmark
          image: benchmark-agentfs:latest
          imagePullPolicy: Never
          command: ["/benchmark", "/data", "123", "100"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          csi:
            driver: agentfs.labs.gke.io
            volumeAttributes:
              volumeID: agentfs-bench-vol
