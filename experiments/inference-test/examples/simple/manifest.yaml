apiVersion: batch/v1
kind: Job
metadata:
  name: inference-test
spec:
  template:
    spec:
      containers:
      - name: inference-test
        image: inference-test:latest
        env:
        - name: MODELSTORE_URL
          value: http://modelstore.modelstore
        resources:
          limits:
            nvidia.com/gpu: 1
        args: ["--model", "facebook/opt-125m"]
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      restartPolicy: Never
  backoffLimit: 0
