apiVersion: v1
kind: Namespace
metadata:
  name: bema
---
apiVersion: v1
kind: Namespace
metadata:
  name: bema-sandboxes
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bema
  namespace: bema
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bema
  namespace: bema
rules:
  - apiGroups: ["bema.labs.gke.io"]
    resources: ["chatsessions", "chatsessionmessages", "agentactions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bema
  namespace: bema
subjects:
  - kind: ServiceAccount
    name: bema
    namespace: bema
roleRef:
  kind: Role
  name: bema
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-manager
  namespace: bema-sandboxes
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bema-sandbox-manager
  namespace: bema-sandboxes
subjects:
  - kind: ServiceAccount
    name: bema
    namespace: bema
roleRef:
  kind: Role
  name: sandbox-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: bema
  namespace: bema
spec:
  selector:
    app: bema
  ports:
    - name: grpc
      protocol: TCP
      port: 50051
      targetPort: 50051
    - name: http
      protocol: TCP
      port: 443
      targetPort: 8443
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bema
  namespace: bema
spec:
  serviceName: "bema"
  replicas: 1
  selector:
    matchLabels:
      app: bema
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
  template:
    metadata:
      labels:
        app: bema
    spec:
      serviceAccountName: bema
      volumes:
        - name: tls
          secret:
            secretName: bema-apiserver-tls
      containers:
        - name: bema
          image: bema:latest
          args:
            - --storage-dir=/data/bema
            - --backend=gemini
            - --tls-cert-file=/etc/tls/tls.crt
            - --tls-key-file=/etc/tls/tls.key
          ports:
            - containerPort: 50051
            - containerPort: 8443
          env:
            - name: BEMA_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - secretRef:
                name: bema
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /etc/tls
              readOnly: true
