apiVersion: v1
kind: Service
metadata:
  name: bema
spec:
  selector:
    app: bema
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bema
spec:
  serviceName: "bema"
  replicas: 1
  selector:
    matchLabels:
      app: bema
  template:
    metadata:
      labels:
        app: bema
    spec:
      containers:
        - name: bema
          image: bema:latest
          ports:
            - containerPort: 50051
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
