# This manifest registers the Bema aggregated API server with Kubernetes.
# Note: You MUST provide a valid caBundle (base64 encoded) that matches
# the certificate served by the Bema pod.
# The register-apiserver.sh script handles this automatically.

apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.bema.labs.gke.io
spec:
  service:
    name: bema
    namespace: bema
    port: 443
  group: bema.labs.gke.io
  version: v1alpha1
  groupPriorityMinimum: 100
  versionPriority: 100
  caBundle: <BASE64_ENCODED_CA_BUNDLE>
