apiVersion: v1
kind: Namespace
metadata:
  name: memcached-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memcache-deployment
  namespace: memcached-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memcache
  template:
    metadata:
      labels:
        app: memcache
    spec:
      containers:
      - name: memcached
        image: test-memcache-server:e2e
        imagePullPolicy: Never
        ports:
        - containerPort: 11211
        - containerPort: 8080
        resources:
          limits:
            memory: 64Mi
          requests:
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: memcache-service
  namespace: memcached-test
spec:
  selector:
    app: memcache
  ports:
  - port: 11211
    targetPort: 11211
    name: memcache
  - port: 8080
    targetPort: 8080
    name: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memcache-client
  namespace: memcached-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memcache-client
  template:
    metadata:
      labels:
        app: memcache-client
    spec:
      containers:
      - name: client
        image: test-memcache-client:e2e
        imagePullPolicy: Never
        args:
        - "-server=memcache-service:11211"
        - "-min-ops=20"
        - "-max-ops=50"
