apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scalingpolicies.generation-ai.gke.io
spec:
  group: generation-ai.gke.io
  names:
    kind: ScalingPolicy
    listKind: ScalingPolicyList
    plural: scalingpolicies
    singular: scalingpolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              target:
                type: object
                properties:
                  kind:
                    type: string
                  name:
                    type: string
                required: ["kind", "name"]
              inputs:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    metric:
                      type: string
                  required: ["name", "metric"]
              values:
                type: array
                items:
                  type: object
                  properties:
                    path:
                      type: string
                    expression:
                      type: string
                    min:
                      type: integer
                    max:
                      type: integer
                  required: ["path", "expression"]
            required: ["target", "inputs", "values"]
    subresources:
      status: {}
