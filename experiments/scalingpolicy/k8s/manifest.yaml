apiVersion: v1
kind: Namespace
metadata:
  name: kube-scalingpolicy-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scalingpolicy-controller
  namespace: kube-scalingpolicy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scalingpolicy-controller
rules:
- apiGroups: ["generation-ai.gke.io"]
  resources: ["scalingpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["generation-ai.gke.io"]
  resources: ["scalingpolicies/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scalingpolicy-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scalingpolicy-controller
subjects:
- kind: ServiceAccount
  name: scalingpolicy-controller
  namespace: kube-scalingpolicy-system
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scalingpolicy-controller
  namespace: kube-scalingpolicy-system
  labels:
    app: scalingpolicy-controller
spec:
  serviceName: scalingpolicy-controller
  replicas: 1
  selector:
    matchLabels:
      app: scalingpolicy-controller
  template:
    metadata:
      labels:
        app: scalingpolicy-controller
    spec:
      serviceAccountName: scalingpolicy-controller
      containers:
      - name: manager
        image: scalingpolicy-controller:latest
        command:
        - /manager
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
