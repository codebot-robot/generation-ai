syntax = "proto3";

package router;

option go_package = "github.com/gke-labs/generation-ai/experiments/model-manifest/pkg/api/v1alpha1;v1alpha1";

service ModelRouter {
  rpc PrepareModel(PrepareModelRequest) returns (PrepareModelResponse) {}
  rpc NewSession(NewSessionRequest) returns (NewSessionResponse) {}
  rpc Chat(ChatRequest) returns (ChatResponse) {}
}

message PrepareModelRequest {
  string model_id = 1;
  string manifest_json = 2;
  string binding_json = 3;
  bytes prefill_graph = 4;
  bytes decode_graph = 5;
}

message PrepareModelResponse {
  string prepared_model_id = 1;
}

service ModelExecutor {
  rpc LoadModel(LoadModelRequest) returns (LoadModelResponse) {}
  rpc NewSession(NewSessionRequest) returns (NewSessionResponse) {}
  rpc Chat(ChatRequest) returns (ChatResponse) {}
}

message LoadModelRequest {
  string manifest_json = 1;
  string binding_json = 2;
  bytes prefill_graph = 3;
  bytes decode_graph = 4;
}

message LoadModelResponse {
  bool success = 1;
}

message NewSessionRequest {
  string model_id = 1;
}

message NewSessionResponse {
  string session_id = 1;
}

message ChatRequest {
  string session_id = 1;
  string text = 2;
  int32 max_new_tokens = 3;
}

message ChatResponse {
  string text = 1;
  int32 session_tokens = 2;
  int32 new_prompt_tokens = 3;
  int32 generated = 4;
  float prefill_ms = 5;
  float ms_per_token = 6;
}
