apiVersion: v1
kind: Service
metadata:
  name: finetuning-server
spec:
  selector:
    app: finetuning-server
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finetuning-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finetuning-server
  template:
    metadata:
      labels:
        app: finetuning-server
    spec:
      containers:
      - name: server
        image: finetuning-server:latest
        ports:
        - containerPort: 50051
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
          limits:
            cpu: "4"
            memory: "16Gi"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: finetuning-client
spec:
  template:
    spec:
      containers:
      - name: client
        image: finetuning-client:latest
        args: ["--host", "finetuning-server:50051", "--max_steps", "5"]
      restartPolicy: Never
  backoffLimit: 0
